# apps namespace: api-server, price-alert, price-collector에서 사용하는 값
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: apps
type: Opaque
stringData:
  # ===== MySQL: api-server =====
  DB_USERNAME: "<mysql-username>"
  DB_PASSWORD: "<mysql-password>"
  DB_URL: "jdbc:mysql://mysql.data.svc.cluster.local:3306/skytracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  # ===== Redis Sentinel: api-server, price-collector =====
  SPRING_DATA_REDIS_PASSWORD: "<redis-password>"
  SPRING_DATA_REDIS_SENTINEL_PASSWORD: "<redis-sentinel-password>"
  SPRING_DATA_REDIS_SENTINEL_MASTER: "mymaster"
  SPRING_DATA_REDIS_SENTINEL_NODES: "redis-node-0.redis-headless.data.svc.cluster.local:26379,redis-node-1.redis-headless.data.svc.cluster.local:26379,redis-node-2.redis-headless.data.svc.cluster.local:26379"

  # ===== Kafka: api-server, price-alert, price-collector =====
  KAFKA_BOOTSTRAP_SERVERS: "my-cluster-kafka-bootstrap.kafka.svc:9092"

  # ===== OAuth2: api-server =====
  GOOGLE_CLIENT_ID: "<google-client-id>"
  GOOGLE_CLIENT_SECRET: "<google-client-secret>"
  KAKAO_CLIENT_ID: "<kakao-client-id>"
  KAKAO_CLIENT_SECRET: "<kakao-client-secret>"
  NAVER_CLIENT_ID: "<naver-client-id>"
  NAVER_CLIENT_SECRET: "<naver-client-secret>"

  # ===== JWT: api-server =====
  JWT_SECRET: "<jwt-secret>"
  JWT_EXPIRATION: "3600000"
  JWT_REFRESH_EXPIRATION: "604800000"

  # ===== Amadeus API: api-server =====
  AMADEUS_CLIENT_ID: "<amadeus-client-id>"
  AMADEUS_CLIENT_SECRET: "<amadeus-client-secret>"

  # ===== Elasticsearch: api-server =====
  ES_URI: "http://elastic-es-http.data.svc:9200"
  ES_USERNAME: "elastic"
  ES_PASSWORD: "<elasticsearch-password>"

  # ===== Mail: price-alert =====
  SPRING_MAIL_USERNAME: "<mail-username>"
  SPRING_MAIL_PASSWORD: "<mail-password>"

  # ===== OpenAI: api-server =====
  GPT_API: "<openai-api-key>"

---
# data namespace: MySQL, Logstash에서 사용하는 값
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: data
type: Opaque
stringData:
  # ===== MySQL StatefulSet =====
  DB_PASSWORD: "<mysql-root-password>"

  # ===== Logstash -> Kafka / Elasticsearch =====
  KAFKA_BOOTSTRAP_SERVERS: "my-cluster-kafka-bootstrap.kafka.svc:9092"
  ES_URI: "http://elastic-es-http.data.svc:9200"
  ES_USERNAME: "elastic"
  ES_PASSWORD: "<elasticsearch-password>"
